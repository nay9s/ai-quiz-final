<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8"/>
    <meta content="width=device-width,initial-scale=1" name="viewport"/>
    <title>
      Quiz
    </title>
    <link href="styles.css" rel="stylesheet"/>
    <link href="learner.css" rel="stylesheet"/>
    <link href="web-dialog.css" rel="stylesheet"/>
  </head>
  <body class="learner-app">
    <div class="wrap">
      <div class="top" id="homeHeader">
        <div class="brand">
          <h1>
            Quiz
          </h1>
        </div>
        <div class="header-actions">
          <button aria-checked="false" aria-label="เปิดดาร์กโหมด" class="theme-toggle" id="themeToggle" role="switch" title="เปลี่ยนธีม" type="button">
            <span aria-hidden="true" class="theme-icon sun">
              <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.9" viewbox="0 0 24 24">
                <circle cx="12" cy="12" r="3.6">
                </circle>
                <path d="M12 2.3v2.1M12 19.6v2.1M2.3 12h2.1M19.6 12h2.1M5.15 5.15l1.5 1.5M17.35 17.35l1.5 1.5M18.85 5.15l-1.5 1.5M6.65 17.35l-1.5 1.5">
                </path>
              </svg>
            </span>
            <span aria-hidden="true" class="theme-track">
              <span class="theme-thumb">
              </span>
            </span>
            <span aria-hidden="true" class="theme-icon moon">
              <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9" viewbox="0 0 24 24">
                <path d="M20.2 15.1A8.4 8.4 0 0 1 8.9 3.8 8.5 8.5 0 1 0 20.2 15.1Z">
                </path>
              </svg>
            </span>
          </button>
          <button aria-label="ประวัติคะแนน" class="btn icon-btn" id="openStats" title="ประวัติคะแนน" type="button">
            <svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9" viewbox="0 0 24 24">
              <path d="M3 12a9 9 0 1 0 3-6.7">
              </path>
              <path d="M3 4.5v5h5">
              </path>
              <path d="M12 7.5V12l3 2">
              </path>
            </svg>
          </button>
          <button aria-label="การตั้งค่า Quiz" class="btn icon-btn" id="openSettings" title="การตั้งค่า Quiz" type="button">
            <svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9" viewbox="0 0 24 24">
              <circle cx="12" cy="12" r="3">
              </circle>
              <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.12 2.12-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V20.3h-3v-.08a1.7 1.7 0 0 0-1.03-1.56 1.7 1.7 0 0 0-1.88.34l-.06.06-2.12-2.12.06-.06A1.7 1.7 0 0 0 7 15a1.7 1.7 0 0 0-1.56-1.03H5.3v-3h.14A1.7 1.7 0 0 0 7 9.94a1.7 1.7 0 0 0-.34-1.88L6.6 8l2.12-2.12.06.06a1.7 1.7 0 0 0 1.88.34 1.7 1.7 0 0 0 1.03-1.56V4.7h3v.02a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.88-.34l.06-.06L19.8 8l-.06.06a1.7 1.7 0 0 0-.34 1.88 1.7 1.7 0 0 0 1.56 1.03h.04v3h-.04A1.7 1.7 0 0 0 19.4 15Z">
              </path>
            </svg>
          </button>
        </div>
      </div>
      <section class="panel" id="home">
        <div class="stats">
          <div class="stat">
            <b id="totalAttempts">
              0
            </b>
            ครั้งที่ทำ
          </div>
          <div class="stat">
            <b id="bestScore">
              0%
            </b>
            คะแนนสูงสุด
          </div>
          <div class="stat">
            <b id="avgScore">
              0%
            </b>
            คะแนนเฉลี่ย
          </div>
        </div>
        <div class="resume-card hidden" id="resumeCard"><div><h3>แบบทดสอบที่พักไว้</h3><p id="resumeDetail"></p></div><div class="resume-actions"><button class="btn primary" id="resumeQuiz">ทำต่อ</button><button class="btn ghost" id="discardProgress">ลบชุดที่พักไว้</button></div></div>
        <div class="section-heading"><div><h2>เลือกบท</h2><p>เลือกได้มากกว่า 1 บท</p></div><span class="selection-pill" id="selectionSummary"></span></div>
        <div class="grid" id="chapterGrid">
        </div>
        <div class="study-mode-picker" role="group" aria-label="รูปแบบการทำแบบทดสอบ" aria-describedby="modeHelp"><button class="mode-card" id="practiceMode" type="button" aria-pressed="false">ฝึกทำ</button><button class="mode-card" id="examMode" type="button" aria-pressed="false">สอบ</button></div>
        <p class="mode-help" id="modeHelp">เลือกคำตอบแล้วเฉลยทันที</p>
        <label class="exam-time hidden" id="examTimeWrap"><span>เวลาสอบ</span><select id="examMinutes" aria-describedby="examTimeHelp"><option value="0">ไม่จำกัดเวลา</option><option value="10">10 นาที</option><option value="20">20 นาที</option><option value="30">30 นาที</option><option value="60">60 นาที</option></select></label>
        <p class="mode-help hidden" id="examTimeHelp">ส่งคำตอบอัตโนมัติเมื่อหมดเวลา</p>
        <div class="home-actions">
          <div class="selection-actions">
            <button class="btn ghost selection-icon" id="selectAll" type="button" aria-label="เลือกทุกบท" title="เลือกทุกบท">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="7" width="14" height="14" rx="3"/><path d="M16 3H6a3 3 0 0 0-3 3v10m8-2 2 2 4-4"/></svg>
            </button>
            <button class="btn ghost selection-icon" id="clearAll" type="button" aria-label="ล้างการเลือกบท" title="ล้างการเลือกบท">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12h8"/></svg>
            </button>
          </div>
          <div class="start-actions">
            <button class="btn primary" id="start">
              เริ่มทำ Quiz
            </button>
          </div>
        </div>
        <div class="home-footnote"><span>คำถามปลายเปิดใช้ฝึกเขียน ไม่รวมในคะแนน</span><a href="admin.html">จัดการชุดข้อสอบ</a></div>
      </section>
      <section class="panel quiz-panel hidden" id="quiz">
        <div class="chapter-tabs-wrap hidden" id="chapterTabsWrap">
          <div class="chapter-tabs" id="chapterTabs">
          </div>
        </div>
        <div class="quiz-content">
          <div class="blog-questions hidden" id="blogQuestions"></div>
          <div class="slotWrap">
            <div class="slots" id="slots" role="group" aria-label="เลือกข้อ">
            </div>
          </div>
          <div class="question-card">
            <div class="paged-question-tools"><span id="pagedModeLabel" class="eyebrow"></span><div class="question-icon-actions"><span id="pagedAnswerIcon"></span><button class="bookmark-btn" id="flagCurrent" type="button" aria-pressed="false">ปักหมุด</button></div></div>
            <div class="question-kicker" id="questionKicker">
              คำถาม 01
            </div>
            <img class="qimg hidden" id="qimg"/>
            <div class="qtitle" id="qtitle">
            </div>
            <div class="options" id="options">
            </div>
          </div>
          <div class="quiz-footer">
            <div class="footer-progress-row">
              <div class="bar" role="progressbar" aria-label="ความคืบหน้าการตอบคำถาม" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="progressBar"></span></div>
              <button id="remainingCount" class="progress-fraction" type="button" title="ไปข้อที่ยังไม่ตอบ"></button>
              <button id="flaggedCount" class="footer-icon" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg><span id="flaggedNumber">0</span></button>
              <button id="questionMap" class="footer-icon" type="button" aria-label="ดูข้อทั้งหมด" title="ดูข้อทั้งหมด"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></button>
              <span id="sessionClock" class="session-clock hidden" role="timer" aria-label="เวลาที่เหลือ"></span>
            </div>
            <button class="btn ghost quit-btn" id="quit" type="button">
              <svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9" viewbox="0 0 24 24">
                <path d="M10 5H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h4">
                </path>
                <path d="m15 8 4 4-4 4">
                </path>
                <path d="M19 12H9">
                </path>
              </svg>
              พักไว้ก่อน
            </button>
            <div class="nav-actions">
              <button class="btn nav-btn" id="prev">
                <svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
                  <path d="m15 18-6-6 6-6">
                  </path>
                </svg>
                ย้อนกลับ
              </button>
              <button class="btn primary nav-btn" id="next">
                ถัดไป
                <svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
                  <path d="m9 18 6-6-6-6">
                  </path>
                </svg>
              </button>
            </div>
            <span id="saveStatus" class="save-status hidden" aria-live="polite"></span>
          </div>
        </div>
      </section>
      <section class="panel result hidden" id="result">
        <h2>
          ผลการทดสอบ
        </h2>
        <div class="score" id="resultScore">
        </div>
        <p id="resultDetail">
        </p>
        <p class="result-notice hidden" id="resultMessage"></p>
        <div id="chapterResults" class="chapter-results"></div>
        <div class="retry-actions"><button class="btn primary" id="retryWrong">ทบทวนข้อผิด</button><button class="btn" id="retryFlagged">ทบทวนข้อที่ปักหมุด</button></div>
        <div class="row result-actions">
          <button class="btn" id="reviewThis">
            ดูเฉลยชุดนี้
          </button>
          <button class="btn primary" id="backHome">
            กลับหน้าเลือกบท
          </button>
        </div>
        <div class="result-review hidden" id="resultReview">
        </div>
      </section>
    </div>
    <div class="modal hidden" id="modal">
      <div class="modalbox" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1">
        <div class="top">
          <h2 id="modalTitle">
            เฉลย
          </h2>
          <button class="btn" id="closeModal">
            ปิด
          </button>
        </div>
        <div id="modalContent">
        </div>
      </div>
    </div>
    <script src="questions-data.js">
    </script>
    <script src="answers-data.js">
    </script>
    <script src="quiz-data-tools.js"></script>
    <script src="learner.js"></script>
    <script src="web-dialog.js"></script>
    <script defer="" src="app.js">
    </script>
  </body>
</html>
